<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#18181B">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Thực Đơn Điện Tử | Good Morning Café Hội An</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background-color: #FFFFFF;
      color: #18181B;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes marqueeRun {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .marquee-track {
      display: flex;
      width: max-content;
      animation: marqueeRun 20s linear infinite;
    }
    .marquee-track:hover { animation-play-state: paused; }

    /* Concept 2.6: Borderless Underline Flow */
    .sidebar-btn {
      border-radius: 0;
      position: relative;
      color: #52525B;
      transition: color 0.15s ease;
    }
    .sidebar-btn:hover {
      color: #000000;
    }
    .sidebar-btn.active {
      background: transparent;
      color: #000000;
      font-weight: 800;
    }
    .sidebar-btn.active::after {
      content: '';
      position: absolute;
      bottom: 6px;
      left: 25%;
      width: 50%;
      height: 2.5px;
      background: #000000;
      border-radius: 9999px;
    }
    .borderless-item {
      border: none;
      border-bottom: 1px solid #F3F4F6;
    }
    .borderless-item:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start bg-neutral-100">

  <div class="w-full max-w-md h-screen flex flex-col relative bg-white shadow-xl overflow-hidden">

    <!-- Toast Notification -->
    <div id="toast-message" class="hidden fixed top-14 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-[340px] p-3 rounded-2xl bg-black text-white shadow-2xl border border-white/20 flex items-center justify-between text-xs font-bold transition-all">
      <span id="toast-text">📶 Đã sao chép mật khẩu Wifi!</span>
      <button onclick="hideToast()" class="text-gray-400 hover:text-white p-1">✕</button>
    </div>

    <!-- COMPACT TOP BAR: TITLE + MULTI-CURRENCY + MULTI-LANG + WIFI -->
    <header class="bg-white px-4 py-3 border-b border-gray-100 shrink-0 space-y-2.5">
      <div class="flex items-center justify-between">
        <div>
          <h1 id="store-name" class="text-base font-black text-black tracking-tight">Good Morning Café</h1>
          <div class="flex items-center gap-1.5 text-[10px] text-gray-500 font-mono">
            <span id="store-status" class="text-emerald-600 font-bold">🟢 Open 06:30-22:30</span>
            <span>•</span>
            <span id="store-address">📍 Hội An</span>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- Currencies -->
          <div class="flex items-center bg-gray-100 p-0.5 rounded-lg text-[10px] font-bold">
            <button onclick="setCurrency('VND')" id="curr-vnd" class="px-1.5 py-0.5 rounded bg-black text-white font-bold">₫</button>
            <button onclick="setCurrency('USD')" id="curr-usd" class="px-1.5 py-0.5 rounded text-gray-600">$</button>
            <button onclick="setCurrency('EUR')" id="curr-eur" class="px-1.5 py-0.5 rounded text-gray-600">€</button>
          </div>
          <!-- Languages (EN, VI, RU, FR) -->
          <div class="flex items-center bg-gray-100 p-0.5 rounded-lg text-[11px] font-bold">
            <button onclick="setLanguage('en')" id="lang-en" class="px-1.5 py-0.5 rounded text-gray-600">🇬🇧</button>
            <button onclick="setLanguage('vi')" id="lang-vi" class="px-1.5 py-0.5 rounded bg-black text-white">🇻🇳</button>
            <button onclick="setLanguage('ru')" id="lang-ru" class="px-1.5 py-0.5 rounded text-gray-600">🇷🇺</button>
            <button onclick="setLanguage('fr')" id="lang-fr" class="px-1.5 py-0.5 rounded text-gray-600">🇫🇷</button>
          </div>
        </div>
      </div>

      <!-- Quick 1-Touch WiFi Card -->
      <div class="p-2 bg-neutral-50 rounded-xl border border-neutral-200 flex items-center justify-between text-xs">
        <div class="flex items-center gap-1 text-[11px]">
          <span>📶 WiFi:</span>
          <strong class="text-black">Thi Thi Spa 2</strong>
          <span class="text-gray-300">|</span>
          <span>Pass: <strong class="font-mono text-black">999999999</strong></span>
        </div>
        <button onclick="copyWifiPassword()" class="px-2.5 py-1 bg-black text-white rounded-lg text-[10px] font-bold shadow-xs active:scale-95 transition-transform">
          Copy
        </button>
      </div>

      <!-- Running Best Seller Marquee Bar -->
      <div id="marquee-container" class="overflow-hidden py-1 bg-neutral-50 rounded-lg border border-neutral-100">
        <div id="marquee-track" class="marquee-track flex items-center gap-3 text-[11px] font-bold">
          <span class="text-black font-mono font-black">🔥 BEST SELLERS:</span>
          <span>Đang tải món ngon từ POS...</span>
        </div>
      </div>
    </header>

    <!-- ================= SPLIT-SCREEN 2-COLUMN VIEWPORT ================= -->
    <div class="flex-1 flex overflow-hidden">
      
      <!-- LEFT COLUMN (28% WIDTH): FIXED VERTICAL CATEGORY SIDEBAR -->
      <aside id="sidebar-pane" class="w-[28%] bg-[#F7F7F8] border-r border-neutral-200/80 overflow-y-auto no-scrollbar py-2 flex flex-col gap-1 text-xs shrink-0">
        <!-- Generated Dynamically from POS categories -->
      </aside>

      <!-- RIGHT COLUMN (72% WIDTH): CONTINUOUS FOOD SCROLL WITH STICKY HEADERS -->
      <main id="right-scroll-pane" class="flex-1 overflow-y-auto no-scrollbar p-3 space-y-6 bg-white">
        <!-- Generated Dynamically from POS products -->
        <div class="py-12 text-center text-xs text-neutral-400">
          <span class="inline-block animate-spin text-lg mb-2">⏳</span>
          <p>Đang đồng bộ thực đơn từ máy POS...</p>
        </div>
      </main>

    </div>

    <!-- Dish Modal -->
    <div id="dish-modal" class="hidden fixed inset-0 z-50 flex items-end justify-center bg-black/60 backdrop-blur-xs">
      <div class="w-full max-w-md bg-white rounded-t-[32px] p-5 shadow-2xl max-h-[85vh] flex flex-col relative">
        <button onclick="closeDishModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-neutral-100 text-neutral-800 flex items-center justify-center font-bold text-xs">✕</button>
        <div id="modal-content" class="overflow-y-auto no-scrollbar space-y-3 flex-1 mt-2"></div>
        <div class="pt-3 mt-2 border-t border-gray-100 flex items-center justify-between shrink-0">
          <div>
            <span id="modal-label-price" class="text-[10px] text-gray-400 font-bold block uppercase tracking-wider">Giá tiền</span>
            <span id="modal-price" class="font-mono text-xl font-black text-black">0 ₫</span>
          </div>
          <button onclick="closeDishModal()" id="modal-btn-done" class="px-6 py-2.5 rounded-full bg-black text-white text-xs font-bold active:scale-95 transition-transform">Đóng</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ================= State & Configuration =================
    const CURRENCIES = {
      VND: { symbol: '₫', rate: 1, decimals: 0, pos: 'suffix' },
      USD: { symbol: '$', rate: 1 / 25400, decimals: 2, pos: 'prefix' },
      EUR: { symbol: '€', rate: 1 / 27500, decimals: 2, pos: 'suffix' }
    };

    const I18N = {
      en: {
        wifiCopied: '📶 Copied WiFi: 999999999',
        bestSellers: '🔥 BEST SELLERS:',
        dishesSuffix: 'dishes',
        soldOut: 'SOLD OUT',
        priceLabel: 'Price',
        closeBtn: 'Close',
        ingredients: 'Ingredients',
        emptyMenu: 'No dishes found in this category.',
        categoryNames: {
          'Coffee': 'Coffee',
          'Cà phê': 'Coffee',
          'Tea': 'Teas',
          'Trà': 'Teas',
          'Milk Tea': 'Milk Tea',
          'Trà sữa': 'Milk Tea',
          'Juice': 'Fresh Juice',
          'Nước ép': 'Fresh Juice',
          'Breakfast': 'Breakfast',
          'Điểm tâm': 'Breakfast',
          'Sandwich': 'Artisan Banh Mi',
          'Bánh mì': 'Artisan Banh Mi',
          'Combo': 'Morning Combos'
        }
      },
      vi: {
        wifiCopied: '📶 Đã sao chép WiFi: 999999999',
        bestSellers: '🔥 BÁN CHẠY NHẤT:',
        dishesSuffix: 'món',
        soldOut: 'HẾT HÀNG',
        priceLabel: 'Giá món',
        closeBtn: 'Đóng',
        ingredients: 'Thành phần',
        emptyMenu: 'Không có món trong danh mục này.',
        categoryNames: {
          'Coffee': 'Cà Phê',
          'Cà phê': 'Cà Phê',
          'Tea': 'Trà & Trà Hoa',
          'Trà': 'Trà & Trà Hoa',
          'Milk Tea': 'Trà Sữa',
          'Trà sữa': 'Trà Sữa',
          'Juice': 'Nước Ép Tươi',
          'Nước ép': 'Nước Ép Tươi',
          'Breakfast': 'Điểm Tâm & Bánh',
          'Điểm tâm': 'Điểm Tâm & Bánh',
          'Sandwich': 'Bánh Mì Hội An',
          'Bánh mì': 'Bánh Mì Hội An',
          'Combo': 'Combo Sáng Tiết Kiệm'
        }
      },
      ru: {
        wifiCopied: '📶 Скопирован WiFi: 999999999',
        bestSellers: '🔥 ХИТЫ ПРОДАЖ:',
        dishesSuffix: 'блюд',
        soldOut: 'НЕТ В НАЛИЧИИ',
        priceLabel: 'Цена',
        closeBtn: 'Закрыть',
        ingredients: 'Ингредиенты',
        emptyMenu: 'В этой категории пока нет блюд.',
        categoryNames: {
          'Coffee': 'Кофе',
          'Cà phê': 'Кофе',
          'Tea': 'Чай',
          'Trà': 'Чай',
          'Milk Tea': 'Чай с молоком',
          'Trà sữa': 'Чай с молоком',
          'Juice': 'Свежий сок',
          'Nước ép': 'Свежий сок',
          'Breakfast': 'Завтрак',
          'Điểm tâm': 'Завтрак',
          'Sandwich': 'Бань Ми',
          'Bánh mì': 'Бань Ми',
          'Combo': 'Комбо-наборы'
        }
      },
      fr: {
        wifiCopied: '📶 WiFi copié: 999999999',
        bestSellers: '🔥 MEILLEURES VENTES:',
        dishesSuffix: 'plats',
        soldOut: 'ÉPUISÉ',
        priceLabel: 'Prix',
        closeBtn: 'Fermer',
        ingredients: 'Ingrédients',
        emptyMenu: 'Aucun plat dans cette catégorie.',
        categoryNames: {
          'Coffee': 'Café',
          'Cà phê': 'Café',
          'Tea': 'Thés',
          'Trà': 'Thés',
          'Milk Tea': 'Thé au lait',
          'Trà sữa': 'Thé au lait',
          'Juice': 'Jus de fruits frais',
          'Nước ép': 'Jus de fruits frais',
          'Breakfast': 'Petit Déjeuner',
          'Điểm tâm': 'Petit Déjeuner',
          'Sandwich': 'Banh Mi',
          'Bánh mì': 'Banh Mi',
          'Combo': 'Formules Matin'
        }
      }
    };

    const CATEGORY_ICONS = {
      'coffee': '☕',
      'cà phê': '☕',
      'tea': '🍃',
      'trà': '🍃',
      'milk tea': '🧋',
      'trà sữa': '🧋',
      'juice': '🍊',
      'nước ép': '🍊',
      'breakfast': '🥐',
      'điểm tâm': '🥐',
      'sandwich': '🥪',
      'banh mi': '🥪',
      'bánh mì': '🥪',
      'combo': '⭐'
    };

    let currentCurrency = 'VND';
    let currentLanguage = 'vi';
    let currentData = { products: [], categories: [], store: {} };
    let activeCategoryId = '';

    function getCategoryIcon(catName) {
      const key = String(catName || '').toLowerCase().trim();
      return CATEGORY_ICONS[key] || '🍽️';
    }

    function getLocalizedCategoryName(catName) {
      const dict = I18N[currentLanguage]?.categoryNames || {};
      return dict[catName] || catName;
    }

    function getLocalizedProductName(p) {
      if (currentLanguage === 'en') return p.nameEn || p.name;
      if (currentLanguage === 'ru') return p.nameRu || p.nameEn || p.name;
      if (currentLanguage === 'fr') return p.nameFr || p.nameEn || p.name;
      return p.name;
    }

    function getLocalizedProductDesc(p) {
      if (currentLanguage === 'en') return p.descEn || p.description;
      if (currentLanguage === 'ru') return p.descRu || p.descEn || p.description;
      if (currentLanguage === 'fr') return p.descFr || p.descEn || p.description;
      return p.description;
    }

    function formatPrice(vnd) {
      const c = CURRENCIES[currentCurrency] || CURRENCIES.VND;
      const converted = (Number(vnd) || 0) * c.rate;
      const formatted = converted.toLocaleString(undefined, { minimumFractionDigits: c.decimals, maximumFractionDigits: c.decimals });
      return c.pos === 'prefix' ? `${c.symbol}${formatted}` : `${formatted} ${c.symbol}`;
    }

    // ================= Render UI =================
    function renderMenu() {
      const products = currentData.products || [];
      const categories = currentData.categories || [];

      // Determine distinct categories that have products or are declared
      const catList = [];
      const seen = new Set();
      
      // Add defined categories first
      categories.forEach(c => {
        if (c && !seen.has(c)) {
          seen.add(c);
          catList.push(c);
        }
      });
      // Add any additional categories present on products
      products.forEach(p => {
        if (p.category && !seen.has(p.category)) {
          seen.add(p.category);
          catList.push(p.category);
        }
      });

      if (catList.length === 0 && products.length > 0) {
        catList.push('Thực đơn');
      }

      // 1. Render Left Sidebar
      const sidebarPane = document.getElementById('sidebar-pane');
      if (!activeCategoryId && catList.length > 0) {
        activeCategoryId = slugify(catList[0]);
      }

      sidebarPane.innerHTML = catList.map((cat, idx) => {
        const catSlug = slugify(cat);
        const isActive = activeCategoryId === catSlug || (!activeCategoryId && idx === 0);
        return `
          <button onclick="scrollToCategory('${catSlug}')" id="cat-btn-${catSlug}" class="sidebar-btn ${isActive ? 'active' : ''} w-full py-3 px-1.5 flex flex-col items-center gap-1 text-[11px] font-semibold transition-all text-center">
            <span class="text-xl">${getCategoryIcon(cat)}</span>
            <span class="leading-tight line-clamp-2">${getLocalizedCategoryName(cat)}</span>
          </button>
        `;
      }).join('');

      // 2. Render Right Content Scroll
      const rightPane = document.getElementById('right-scroll-pane');
      if (products.length === 0) {
        rightPane.innerHTML = `
          <div class="py-16 text-center text-xs text-neutral-400">
            <span class="text-3xl block mb-2">📋</span>
            <p>${I18N[currentLanguage].emptyMenu}</p>
          </div>
        `;
        return;
      }

      rightPane.innerHTML = catList.map(cat => {
        const catSlug = slugify(cat);
        const catProducts = products.filter(p => (p.category || '').toLowerCase() === cat.toLowerCase() || (catList.length === 1));
        if (catProducts.length === 0) return '';

        return `
          <section id="sec-${catSlug}" class="space-y-2">
            <!-- Sticky Section Header -->
            <div class="sticky top-0 bg-white/95 backdrop-blur-sm py-2 border-b border-neutral-100 flex items-center justify-between z-10">
              <h3 class="font-black text-xs text-black uppercase tracking-wider flex items-center gap-1.5">
                <span>${getCategoryIcon(cat)}</span>
                <span>${getLocalizedCategoryName(cat)}</span>
              </h3>
              <span class="text-[10px] text-neutral-400 font-mono">${catProducts.length} ${I18N[currentLanguage].dishesSuffix}</span>
            </div>

            <!-- Borderless Items Flow -->
            <div class="divide-y divide-neutral-100">
              ${catProducts.map(p => {
                const isSoldOut = p.available === false;
                const name = getLocalizedProductName(p);
                const desc = getLocalizedProductDesc(p);
                const defaultFallbackImg = 'https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=200&auto=format&fit=crop&q=80';
                const imgSrc = p.image || defaultFallbackImg;

                return `
                  <div onclick="openDishModal(${p.id})" class="borderless-item py-3 flex items-center justify-between gap-3 cursor-pointer hover:bg-neutral-50/70 active:scale-99 transition-all ${isSoldOut ? 'opacity-50 grayscale' : ''}">
                    <div class="flex-1 min-w-0">
                      ${isSoldOut ? `
                        <span class="text-[8px] font-bold text-red-700 bg-red-50 border border-red-200 px-1.5 py-0.2 rounded font-mono inline-block mb-0.5">
                          ${I18N[currentLanguage].soldOut}
                        </span>
                      ` : (p.badge ? `
                        <span class="text-[8px] font-bold text-neutral-800 bg-neutral-100 px-1.5 py-0.2 rounded font-mono inline-block mb-0.5">
                          ${p.badge}
                        </span>
                      ` : '')}

                      <h4 class="font-bold text-xs text-black leading-snug truncate">${name}</h4>
                      ${desc ? `<p class="text-[10px] text-neutral-500 line-clamp-1 mt-0.5">${desc}</p>` : ''}

                      <div class="mt-1 flex items-baseline gap-2">
                        <span class="font-mono text-xs font-black text-black">${formatPrice(p.price)}</span>
                        ${p.originalPrice && p.originalPrice > p.price ? `
                          <span class="font-mono text-[10px] text-neutral-400 line-through">${formatPrice(p.originalPrice)}</span>
                        ` : ''}
                      </div>
                    </div>

                    <div class="w-16 h-16 rounded-xl overflow-hidden bg-neutral-100 shrink-0 border border-neutral-100 relative">
                      <img src="${imgSrc}" alt="${name}" onerror="this.src='${defaultFallbackImg}'" class="w-full h-full object-cover">
                      ${isSoldOut ? `<div class="absolute inset-0 bg-black/30 flex items-center justify-center text-[9px] font-bold text-white">HẾT</div>` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        `;
      }).join('');

      // 3. Render Best Seller Marquee
      renderMarquee(products);

      // 4. Render Store Info
      if (currentData.store) {
        if (currentData.store.name) document.getElementById('store-name').innerText = currentData.store.name;
        if (currentData.store.address) document.getElementById('store-address').innerText = `📍 ${currentData.store.address}`;
        if (currentData.store.openHours) document.getElementById('store-status').innerText = `🟢 Open ${currentData.store.openHours}`;
      }
    }

    function renderMarquee(products) {
      const marqueeTrack = document.getElementById('marquee-track');
      const featured = products.filter(p => p.isFeatured || (p.badge && p.badge.length > 0) || p.price > 0).slice(0, 8);
      if (featured.length === 0) return;

      const itemsHtml = featured.map(p => {
        const name = getLocalizedProductName(p);
        const priceStr = formatPrice(p.price);
        return `<span onclick="openDishModal(${p.id})" class="cursor-pointer hover:underline inline-flex items-center gap-1"><span>${p.emoji || '☕'}</span> <span>${name}</span> <span class="font-mono text-neutral-600">(${priceStr})</span></span>`;
      }).join('<span>•</span>');

      marqueeTrack.innerHTML = `
        <span class="text-black font-mono font-black">${I18N[currentLanguage].bestSellers}</span>
        ${itemsHtml}
        <span>•</span>
        ${itemsHtml}
      `;
    }

    function slugify(text) {
      return String(text || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\\u0300-\\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '') || 'cat';
    }

    function scrollToCategory(catSlug) {
      const el = document.getElementById('sec-' + catSlug);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });

      document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('cat-btn-' + catSlug);
      if (btn) btn.classList.add('active');
      activeCategoryId = catSlug;
    }

    // Scroll spy for left sidebar sync
    const rightScroll = document.getElementById('right-scroll-pane');
    if (rightScroll) {
      rightScroll.addEventListener('scroll', () => {
        const sections = rightScroll.querySelectorAll('section');
        let currentSec = '';
        sections.forEach(sec => {
          const top = sec.getBoundingClientRect().top;
          if (top <= 180) {
            currentSec = sec.id.replace('sec-', '');
          }
        });
        if (currentSec && currentSec !== activeCategoryId) {
          activeCategoryId = currentSec;
          document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
          document.getElementById('cat-btn-' + currentSec)?.classList.add('active');
        }
      });
    }

    // ================= Interactive Handlers =================
    function setCurrency(curr) {
      currentCurrency = curr;
      document.querySelectorAll('#curr-vnd, #curr-usd, #curr-eur').forEach(b => b.className = 'px-1.5 py-0.5 rounded text-gray-600');
      document.getElementById(`curr-${curr.toLowerCase()}`).className = 'px-1.5 py-0.5 rounded bg-black text-white font-bold';
      renderMenu();
      showToast(`Tiền tệ: ${curr}`);
    }

    function setLanguage(lang) {
      currentLanguage = lang;
      document.querySelectorAll('#lang-en, #lang-vi, #lang-ru, #lang-fr').forEach(b => b.className = 'px-1.5 py-0.5 rounded text-gray-600');
      document.getElementById(`lang-${lang}`).className = 'px-1.5 py-0.5 rounded bg-black text-white';

      document.getElementById('modal-label-price').innerText = I18N[lang].priceLabel;
      document.getElementById('modal-btn-done').innerText = I18N[lang].closeBtn;

      renderMenu();
      showToast(`Ngôn ngữ: ${lang.toUpperCase()}`);
    }

    function copyWifiPassword() {
      navigator.clipboard.writeText('999999999').then(() => {
        showToast(I18N[currentLanguage].wifiCopied);
      }).catch(() => {
        showToast('📶 Pass WiFi: 999999999');
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast-message');
      const text = document.getElementById('toast-text');
      if (t && text) {
        text.innerText = msg;
        t.classList.remove('hidden');
        setTimeout(() => t.classList.add('hidden'), 3000);
      }
    }
    function hideToast() { document.getElementById('toast-message')?.classList.add('hidden'); }

    function openDishModal(id) {
      const item = (currentData.products || []).find(p => p.id === id);
      if (!item) return;

      const name = getLocalizedProductName(item);
      const desc = getLocalizedProductDesc(item);
      const defaultFallbackImg = 'https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=500&auto=format&fit=crop&q=80';
      const imgSrc = item.image || defaultFallbackImg;

      document.getElementById('modal-price').innerText = formatPrice(item.price);
      document.getElementById('modal-content').innerHTML = `
        <div class="h-48 w-full rounded-2xl overflow-hidden bg-neutral-100 border border-neutral-200">
          <img src="${imgSrc}" alt="${name}" onerror="this.src='${defaultFallbackImg}'" class="w-full h-full object-cover">
        </div>
        <div class="flex items-center gap-2 mt-2">
          ${item.badge ? `<span class="text-[9px] font-mono px-2 py-0.5 rounded bg-black text-white font-bold">${item.badge}</span>` : ''}
          <span class="text-[9px] font-mono px-2 py-0.5 rounded bg-neutral-100 text-neutral-800 font-bold">${getLocalizedCategoryName(item.category || 'Món')}</span>
          ${item.available === false ? `<span class="text-[9px] font-mono px-2 py-0.5 rounded bg-red-100 text-red-700 font-bold">${I18N[currentLanguage].soldOut}</span>` : ''}
        </div>
        <h3 class="text-base font-black text-black mt-1">${name}</h3>
        ${desc ? `<p class="text-xs text-neutral-600 leading-relaxed">${desc}</p>` : ''}
        ${item.ingredients ? `
          <div class="pt-2 border-t border-neutral-100 mt-2">
            <span class="text-[10px] font-bold text-neutral-400 block uppercase tracking-wider">${I18N[currentLanguage].ingredients}</span>
            <p class="text-xs text-neutral-700 mt-0.5 font-medium">${item.ingredients}</p>
          </div>
        ` : ''}
      `;
      document.getElementById('dish-modal').classList.remove('hidden');
    }
    function closeDishModal() { document.getElementById('dish-modal').classList.add('hidden'); }

    // ================= Dynamic Multi-Layer Data Sync Engine =================
    async function fetchMenuFromPOS() {
      // Layer 1: Try Local POS API directly
      const endpoints = [
        '/api/public-menu',
        `${window.location.protocol}//${window.location.hostname}:3000/api/public-menu`,
        `./menu.json?v=${Date.now()}`
      ];

      for (const ep of endpoints) {
        try {
          const controller = new AbortController();
          const tid = setTimeout(() => controller.abort(), 2000);
          const res = await fetch(ep, { signal: controller.signal });
          clearTimeout(tid);
          if (res.ok) {
            const data = await res.json();
            if (data && data.products && Array.isArray(data.products)) {
              currentData = data;
              try { localStorage.setItem('gm_cloud_menu_cache', JSON.stringify(data)); } catch (e) {}
              renderMenu();
              return;
            }
          }
        } catch (e) {
          // Next endpoint
        }
      }

      // Layer 2: LocalStorage cache fallback
      try {
        const cached = localStorage.getItem('gm_cloud_menu_cache');
        if (cached) {
          const data = JSON.parse(cached);
          if (data && data.products && Array.isArray(data.products)) {
            currentData = data;
            renderMenu();
          }
        }
      } catch (e) {}
    }

    // Load initial cache for 0ms visual rendering
    try {
      const cached = localStorage.getItem('gm_cloud_menu_cache');
      if (cached) {
        const data = JSON.parse(cached);
        if (data && data.products) {
          currentData = data;
          renderMenu();
        }
      }
    } catch (e) {}

    // Initial fetch from POS
    fetchMenuFromPOS();

    // Re-fetch every 15 seconds to catch changes from POS Menu Management in real time
    setInterval(fetchMenuFromPOS, 15000);

    // Refresh when user switches back to tab
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) fetchMenuFromPOS();
    });
  </script>
